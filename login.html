<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGames</title>
</head>

<body>
    <header class="cabecalho" id="cabecalho">
        <h1>Faça o seu login no MyGames!</h1>
        <h2>Página de Login</h2>
        <p>Uma plataforma que conecta jogadores de maneira simples e ágil.</p>
        <nav>
            <a href="index.html">Página inicial</a>
            <a href="cadastro.html">Página de Cadastro</a>
            <a href="#cabecalho">Página de Login</a>
            <a href="perfil.html">Meu Perfil</a>
        </nav>
    </header>
    <main>
        <form id="login">

            <fieldset>

                <legend>Informações para login</legend>

                <p>
                    <label for="email">Digite seu email:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="senha">Digite sua senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </p>

                <p>
                    <button type="submit">Fazer login</button>
                </p>

            </fieldset>

        </form>



    </main>

    <footer>


    </footer>
</body>

</html>
