<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGames | Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body data-page="login">
    <header class="cabecalho" id="cabecalho">
        <div class="marca"><span class="marca-icone">M</span><span>MyGames</span></div>
        <h1>Que bom ter você de volta!</h1>
        <h2>Página de Login</h2>
        <p>Acesse sua conta e continue encontrando jogadores.</p>
        <nav><a href="index.html">Página inicial</a><a href="cadastro.html">Criar conta</a><a class="ativo"
                href="login.html">Login</a><a href="perfil.html">Minha conta</a></nav>
    </header>
    <main class="largura-formulario">
        <form id="form-login" novalidate>
            <fieldset>
                <legend>Informações para login</legend>
                <label for="email-login">E-mail</label><input type="email" id="email-login" required
                    autocomplete="email">
                <label for="senha-login">Senha</label><input type="password" id="senha-login" required
                    autocomplete="current-password">
                <button type="submit" class="botao-bloco">Entrar na minha conta</button>
                <p id="mensagem-login" class="mensagem" role="status"></p>
                <p class="texto-ajuda">Ainda não tem uma conta? <a class="link-destaque"
                        href="cadastro.html">Cadastre-se gratuitamente</a>.</p>
            </fieldset>
        </form>
    </main>
    <footer>
        <nav><a href="index.html">Voltar à página inicial</a></nav>
    </footer>
    <script src="assets/js/script.js"></script>
</body>

</html>
